apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: shoply-nodepool
spec:
  template:
    metadata:
      labels:
        role: shoply-worker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: shoply-nodeclass
      requirements:
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["t3", "t3a"]
        - key: "karpenter.k8s.aws/instance-size"
          operator: In
          values: ["medium", "large"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "20"       # 최대 10대 t3.medium(2vCPU)
    memory: "40Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: shoply-nodeclass
spec:
  amiSelectorTerms:
    - alias: al2023@latest  # Amazon Linux 2023 최신 AMI 자동 선택
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "shoply-eks"  # 실제 클러스터 이름으로 변경
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "shoply-eks"  # 실제 클러스터 이름으로 변경
  role: "KarpenterNodeRole-shoply-eks"         # 실제 IAM 역할 이름으로 변경
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        deleteOnTermination: true
