# 온프레미스 워커 노드 스펙: 2vCPU / 4GB × 2대 = 총 4vCPU / 8GB
# 전체 서비스 limits 합계: ~4.3vCPU / ~4.6GB (여유 확보)
# 이 파일은 kubectl patch 또는 kustomize로 common 위에 덮어씀

# Gateway: 트래픽 집중 → 조금 더 여유
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shoply
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"
---
# Product: Redis 캐시 히트율 높아 CPU 낮음
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: shoply
spec:
  template:
    spec:
      containers:
        - name: product
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
---
# Inventory: SELECT FOR UPDATE — DB 대기 많아 CPU 낮음
