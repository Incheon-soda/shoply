apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: shoply
  labels:
    app: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: ghcr.io/incheon-soda/shoply-user:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4005
          envFrom:
            - configMapRef:
                name: shoply-config
            - secretRef:
                name: shoply-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
  namespace: shoply
  labels:
    app: user
spec:
  selector:
    app: user
  ports:
    - port: 4005
      targetPort: 4005
      protocol: TCP
  type: ClusterIP
