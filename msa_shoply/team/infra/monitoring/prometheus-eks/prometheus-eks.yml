global:
  scrape_interval: 15s
  scrape_timeout: 10s

# ============================================================
# EKS 전용 Prometheus (포트 9091). 온프레(9090)와 분리.
# EKS 워커는 공인IP 보유 → iptables 포워딩 없이 NodePort 직접 스크랩.
#   ⚠️ <EKS-...> 자리는 EKS 구축 후 실제 워커 공인IP/엔드포인트로 교체.
#   모든 타겟에 env="eks" 라벨 → 온프레(env="onprem")와 대시보드에서 구분.
# ============================================================
scrape_configs:
  # ── EKS 앱 메트릭 (워커 공인IP:NodePort) ─────────────────────
  - job_name: "app-eks"
    static_configs:
      - targets: ["<EKS-worker-공인IP>:30400"]
        labels: { service: gateway }
      - targets: ["<EKS-worker-공인IP>:30401"]
        labels: { service: product }
      - targets: ["<EKS-worker-공인IP>:30402"]
        labels: { service: inventory }
      - targets: ["<EKS-worker-공인IP>:30403"]
        labels: { service: order }
      - targets: ["<EKS-worker-공인IP>:30404"]
        labels: { service: payment }
    relabel_configs:
      - target_label: env
        replacement: eks

  # ── EKS Node Exporter (DaemonSet, hostPort 9100) ────────────
  - job_name: "node-eks"
    static_configs:
      - targets: ["<EKS-worker1-공인IP>:9100"]
        labels: { node: eks-worker1 }
      - targets: ["<EKS-worker2-공인IP>:9100"]
        labels: { node: eks-worker2 }
    relabel_configs:
      - target_label: env
        replacement: eks

  # ── EKS kube-state-metrics (NodePort 30800) ──────────────────
  - job_name: "kube-state-eks"
    static_configs:
      - targets: ["<EKS-worker-공인IP>:30800"]
    relabel_configs:
      - target_label: env
        replacement: eks

  # ── EKS cAdvisor (DaemonSet, 파드별 메트릭) ─────────────────
  - job_name: "cadvisor-eks"
    static_configs:
      - targets: ["<EKS-worker1-공인IP>:38080"]
        labels: { node: eks-worker1 }
      - targets: ["<EKS-worker2-공인IP>:38080"]
        labels: { node: eks-worker2 }
    relabel_configs:
      - target_label: env
        replacement: eks

  # ── RDS PostgreSQL exporter (EKS 내부 Pod → NodePort) ────────
  - job_name: "postgres-eks"
    static_configs:
      - targets: ["<EKS-worker-공인IP>:<postgres-exporter-NodePort>"]
    relabel_configs:
      - target_label: env
        replacement: eks

  # ── Redis exporter (Redis EC2) ───────────────────────────────
  - job_name: "redis-eks"
    static_configs:
      - targets: ["<EKS-Redis-EC2-IP>:9121"]
    relabel_configs:
      - target_label: env
        replacement: eks